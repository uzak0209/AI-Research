name: Claude Scan

# design-review と adr-hygiene は auto-scan を付けて claude.yml が自動で PR を出す。
# research-trend は proposal のみ（自動 PR しない）。
#
# 頻度はスキャンの性質で分ける。
# - repo を見る 2 種（design-review / adr-hygiene）は毎時。実装中は repo が 1 日に何度も変わる
# - 外部を見る research-trend は日次。OrcaRouter の価格や npm の供給状況は
#   毎時見ても結果が変わらず、API 予算と通知だけが増える
on:
  schedule:
    - cron: '0 * * * *'  # 毎時: design-review + adr-hygiene
    - cron: '0 21 * * *' # UTC 21:00 = JST 06:00: 上記 + research-trend
  workflow_dispatch:
    inputs:
      scan_type:
        description: '回すスキャン。all は 3 種類まとめて'
        type: choice
        options: [all, design-review, adr-hygiene, research-trend]
        default: all
      dry_run:
        description: 'issue を作らず、見つけた内容をログに出すだけ'
        type: boolean
        default: true

# 毎時スキャンが重ならないようにする。
# 21:00 UTC は毎時と日次の両方の cron が発火するので、
# 走行中の分が終わるまで待たせる（cancel はしない。途中で切ると issue が中途半端になる）
concurrency:
  group: claude-scan
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          # schedule 起動なら空。手動起動ならその値
          REQUESTED: ${{ github.event.inputs.scan_type }}
          # どちらの cron が発火したか。手動起動なら空
          CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED" ]; then
            # 手動起動
            if [ "$REQUESTED" = "all" ]; then
              matrix='["design-review","adr-hygiene","research-trend"]'
            else
              matrix="[\"${REQUESTED}\"]"
            fi
          elif [ "$CRON" = "0 21 * * *" ]; then
            # 日次: 外部依存の確認を含めて全部
            matrix='["design-review","adr-hygiene","research-trend"]'
          else
            # 毎時: repo を見る 2 種のみ。
            # 21:00 UTC は毎時 cron も同時に発火するが、そちらは research-trend を
            # 含まないので、日次の分と重ならない
            matrix='["design-review","adr-hygiene"]'
          fi

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "cron='${CRON}' requested='${REQUESTED}' -> ${matrix}"

  scan:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scan_type: ${{ fromJSON(needs.pick.outputs.matrix) }}
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SCAN_TYPE: ${{ matrix.scan_type }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            対象は ${{ github.repository }}。スキャン種別は ${{ matrix.scan_type }}。
            環境変数 DRY_RUN は "${{ github.event.inputs.dry_run || 'false' }}"。

            次の 2 ファイルを Read し、そこに書いてある指示だけに従え。
            書いてない種類の問題は、見つけても今は出さない。

            - `.github/claude-scans/shared.md`
            - `.github/claude-scans/${{ matrix.scan_type }}.md`

            最後に、作った issue の番号と URL を一覧する。
            0 件なら、何を調べてなぜ出さなかったかを出力する。無言で終了しない。
          claude_args: |
            --allowedTools "Bash,Read,Grep,Glob,WebSearch,WebFetch"
