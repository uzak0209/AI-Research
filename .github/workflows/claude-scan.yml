name: Claude Scan

# 日次で 4 種を走らせる。回す回数に制限は置かない。
# design-review と adr-hygiene は auto-scan を付けて claude.yml が自動で PR を出す。
# research-trend と router-retro は proposal のみ（自動 PR しない）。
# router-retro は手動で 1 日に何回でも回せる。母数が足りるかはスキャン側が見て、
# 足りなければ issue を出さずに降りる（ADR-0005）。
on:
  schedule:
    - cron: '0 21 * * *' # UTC 21:00 = JST 06:00
  workflow_dispatch:
    inputs:
      scan_type:
        description: '回すスキャン。all は 4 種類まとめて'
        type: choice
        options: [all, design-review, adr-hygiene, research-trend, router-retro]
        default: all
      lookback_days:
        description: 'router-retro が見る日数。短くすると直近だけを見る'
        type: string
        default: '7'
      dry_run:
        description: 'issue を作らず、見つけた内容をログに出すだけ'
        type: boolean
        default: true

# 手動実行は毎回別グループにして、続けて何回回しても待たされないようにする。
# 定時実行だけは重ならないよう同じグループに入れる。
concurrency:
  group: claude-scan-${{ github.event.inputs.scan_type || 'sched' }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'sched' }}
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          REQUESTED: ${{ github.event.inputs.scan_type }}
        run: |
          set -euo pipefail
          requested="${REQUESTED:-all}"

          if [ "$requested" = "all" ]; then
            echo 'matrix=["design-review","adr-hygiene","research-trend","router-retro"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"${requested}\"]" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scan_type: ${{ fromJSON(needs.pick.outputs.matrix) }}
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SCAN_TYPE: ${{ matrix.scan_type }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          # router-retro が D1 を読むための認証。deploy-worker.yml と同じ Secret を使う。
          # 未設定なら空になり、スキャン側が「読めなければ issue を出さない」で降りる。
          # D1 の database_id は秘密ではないので worker/wrangler.jsonc から読む（Secret にしない）
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            対象は ${{ github.repository }}。スキャン種別は ${{ matrix.scan_type }}。
            環境変数 DRY_RUN は "${{ github.event.inputs.dry_run || 'false' }}"。

            次の 2 ファイルを Read し、そこに書いてある指示だけに従え。
            書いてない種類の問題は、見つけても今は出さない。

            - `.github/claude-scans/shared.md`
            - `.github/claude-scans/${{ matrix.scan_type }}.md`

            最後に、作った issue の番号と URL を一覧する。
            0 件なら、何を調べてなぜ出さなかったかを出力する。無言で終了しない。
          claude_args: |
            --allowedTools "Bash,Read,Grep,Glob,WebSearch,WebFetch"
