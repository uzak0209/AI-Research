<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>AI-Research</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="titlebar" aria-hidden="false">
      <p class="titlebar-title" id="titlebar-title">AI-Research</p>
      <button type="button" class="btn titlebar-btn" data-variant="tertiary" id="open-settings" hidden>
        設定
      </button>
    </header>

    <div class="welcome" id="welcome">
      <div class="welcome-card">
        <h1 class="welcome-title">AI-Research</h1>
        <p class="welcome-lede">~/Recycle にプロジェクトを作成</p>
        <div class="field">
          <label for="welcome-title">プロジェクト名</label>
          <input
            id="welcome-title"
            type="text"
            autocomplete="off"
            placeholder="例: DPDK 研究"
          />
        </div>
        <button class="btn" data-variant="primary" id="welcome-create">プロジェクトを作る</button>
        <p class="welcome-error" id="welcome-error" role="alert" hidden></p>
      </div>
    </div>

    <div class="shell" id="shell" hidden>
      <aside class="nav-sidebar">
        <nav class="app-nav" role="tablist" aria-label="画面の切り替え">
          <button
            class="app-nav-item"
            role="tab"
            id="tab-feed"
            aria-selected="true"
            aria-controls="view-feed"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                d="M5 7h14M5 12h14M5 17h9"
              />
            </svg>
            <span>報告</span>
          </button>
          <button
            class="app-nav-item"
            role="tab"
            id="tab-library"
            aria-selected="false"
            aria-controls="view-library"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                d="M5 4.5h5.5A2.5 2.5 0 0 1 13 7v12.5H7.5A2.5 2.5 0 0 0 5 22V4.5Zm0 0V22m14-17.5h-5.5A2.5 2.5 0 0 0 11 7v12.5h5.5A2.5 2.5 0 0 1 19 22V4.5Z"
              />
            </svg>
            <span>ライブラリ</span>
          </button>
          <button
            class="app-nav-item"
            role="tab"
            id="tab-mypaper"
            aria-selected="false"
            aria-controls="view-mypaper"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                d="M7 4.5h7l4 4V19.5H7Z"
              />
              <path fill="none" stroke="currentColor" stroke-width="1.8" d="M14 4.5V9h4.5" />
            </svg>
            <span>My paper</span>
          </button>
        </nav>

        <div class="nav-context" id="nav-library" hidden>
          <nav aria-label="ライブラリの絞り込み">
            <div class="side-group">
              <p class="side-label">すべて</p>
              <button class="side-item" data-filter="all" aria-pressed="true">
                <span>すべての文献</span><span class="side-count" id="count-all">0</span>
              </button>
              <button class="side-item" data-filter="starred" aria-pressed="false">
                <span>ブックマーク</span><span class="side-count" id="count-starred">0</span>
              </button>
            </div>

            <div class="side-group">
              <p class="side-label">読んだか</p>
              <button class="side-item" data-filter="unread" aria-pressed="false">
                <span>未読</span><span class="side-count" id="count-unread">0</span>
              </button>
              <button class="side-item" data-filter="reading" aria-pressed="false">
                <span>読んでいる</span><span class="side-count" id="count-reading">0</span>
              </button>
              <button class="side-item" data-filter="read" aria-pressed="false">
                <span>読んだ</span><span class="side-count" id="count-read">0</span>
              </button>
            </div>

            <div class="side-group">
              <p class="side-label">タグ</p>
              <div id="tag-list"></div>
            </div>
          </nav>
        </div>


      </aside>

      <div class="workbench">
        <div class="view" id="view-feed" role="tabpanel" aria-labelledby="tab-feed" data-active="true">
          <section class="list-pane" aria-label="調査の報告">
            <div class="pane-head">
              <button class="btn" data-variant="primary" id="feed-collect">最新情報を調査</button>
              <button class="btn" data-variant="secondary" id="feed-sync">調査結果を受け取る</button>
              <!-- <button class="btn" data-variant="secondary" id="feed-score">scoring</button> -->
              <button class="btn" data-variant="tertiary" id="feed-cancel" disabled>キャンセル</button>
            </div>
            <div class="scroll" id="feed-list"></div>
          </section>

          <section class="detail-pane" id="feed-detail" aria-label="報告の詳細" aria-live="polite">
            <div class="empty-state">
              <p class="empty-title">論文を選択</p>
              <p class="empty">調査結果から論文を選択してください。</p>
            </div>
          </section>
        </div>

        <div class="view" id="view-library" role="tabpanel" aria-labelledby="tab-library" data-active="false">
          <section class="list-pane" aria-label="文献の一覧">
            <div class="pane-head">
              <label class="visually-hidden" for="lib-search">文献を検索</label>
              <input type="search" id="lib-search" placeholder="タイトル・著者・メモ" />
              <label class="visually-hidden" for="lib-sort">並び順</label>
              <select id="lib-sort">
                <option value="added">追加が新しい順</option>
                <option value="year">出版年が新しい順</option>
                <option value="title">タイトル順</option>
              </select>
              <button class="btn" data-variant="secondary" id="lib-new" title="書誌を手で入力">
                追加
              </button>
              <button class="btn" data-variant="primary" id="lib-import-pdf" title="PDF から取り込む">
                PDF
              </button>
            </div>
            <div class="scroll" id="lib-list"></div>
          </section>

          <section class="detail-pane" id="lib-detail" aria-label="文献の詳細" aria-live="polite">
            <div class="empty-state">
              <p class="empty-title">文献を選ぶ</p>
              <p class="empty">左の一覧から選ぶと、書誌と PDF がここに開きます。</p>
            </div>
          </section>
        </div>

        <div class="view" id="view-mypaper" role="tabpanel" aria-labelledby="tab-mypaper" data-active="false">
          <section class="list-pane" aria-label="自分の論文">
            <div class="pane-head">
              <button class="btn" data-variant="primary" id="mypaper-import">配置</button>
              <button class="btn" data-variant="secondary" id="mypaper-reveal">Finder で表示</button>
            </div>
            <div class="scroll" id="mypaper-list"></div>
          </section>

          <section class="detail-pane" id="mypaper-detail" aria-label="自分の論文の詳細" aria-live="polite">
            <div class="empty-state">
              <p class="empty-title">ファイルを置く</p>
              <p class="empty"> PDF / 原稿を選択して閲覧・編集できます。</p>
            </div>
          </section>
        </div>
      </div>
    </div>

    <dialog class="settings" id="settings" aria-labelledby="settings-title">
      <div class="settings-form" id="settings-form">
        <header class="settings-head">
          <h2 class="settings-title" id="settings-title">設定</h2>
          <button type="button" class="btn" data-variant="tertiary" id="settings-close">
            閉じる
          </button>
        </header>

        <div class="settings-body">
          <p class="settings-status" id="settings-status" hidden role="status" aria-live="polite"></p>
          <div class="field">
            <label for="proj-title">プロジェクト名</label>
            <input id="proj-title" type="text" autocomplete="off" placeholder="例: DPDK 研究" />
          </div>

          <div class="field auth-block">
            <label>クラウド</label>
            <p class="hint" id="auth-label">未ログイン — 調査の取り込みに必要です</p>
            <div class="actions" data-align="start">
              <button type="button" class="btn" data-variant="primary" id="auth-login">
                Google でログイン
              </button>
              <button type="button" class="btn" data-variant="tertiary" id="auth-logout" hidden>
                ログアウト
              </button>
            </div>
          </div>

          <div class="field">
            <label for="summary">研究の概要</label>
            <p class="hint">公開できる範囲で研究の概要を入力してください。有効論文を収集する際に使用します。</p>
            <textarea
              id="summary"
              rows="4"
              placeholder="例: 高スループット NIC でパケット処理の遅延をどう下げるか"
            ></textarea>
          </div>

          <div class="field">
            <label>キーワード</label>
            <p class="hint">OpenAlex 検索用。英語の専門語・略語にしてください。推測は日本語の概要を英訳します。</p>
            <div class="keyword-tags" id="keyword-tags"></div>
            <div class="keyword-add-row">
              <label class="visually-hidden" for="keyword-add">キーワードを足す</label>
              <input id="keyword-add" type="text" autocomplete="off" placeholder="英語で追加（Enter）" />
              <button type="button" class="btn" data-variant="secondary" id="keyword-infer">
               概要から推測
              </button>
            </div>
          </div>

          <div class="field">
            <p class="side-label">プロジェクトの場所</p>
            <div id="proj-empty">
              <div class="actions" data-align="start">
                <button type="button" class="btn" data-variant="secondary" id="proj-mkdir">
                  プロジェクトを作る
                </button>
                <button type="button" class="btn" data-variant="tertiary" id="proj-open">
                  プロジェクトを開く
                </button>
              </div>
            </div>
            <div id="proj-tree" hidden>
              <p class="statusbar-path" id="settings-root-path"></p>
            </div>
          </div>
        </div>

        <footer class="settings-foot">
          <button type="button" class="btn" data-variant="primary" id="proj-save">保存</button>
        </footer>
      </div>
    </dialog>

    <footer class="statusbar">
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="statusbar-path" id="auth-chip"></p>
      <p class="statusbar-path" id="proj-root"></p>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
